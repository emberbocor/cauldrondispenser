org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Target Minecraft 26.3 exactly.
minecraft_version=26.3
minecraft_version_range=[26.3]
minecraft_label=26.3
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
neo_version=26.3.0.83
# The lowest NeoForge version the mod declares support for: the first NeoForge build for 26.3.
# Verify with: ./gradlew.bat :neoforge:compileJava "-Pneo_version=26.3.0.0-beta"
neo_version_range=[26.3.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

fabric_loader_version=0.19.5
# Fabric API is not needed. Minimum Fabric Loader as on 26.1 and 26.2 (0.19.3 is only required by Fabric API on 26.3).
fabric_loader_version_range=>=0.18.4
# Verify with: ./gradlew.bat :fabric:compileJava "-Pfabric_loader_version=0.18.4"
fabric_minecraft_version_range=26.3

# Forge 66 is the series for Minecraft 26.3.
# Verify the minimum with: ./gradlew.bat :forge:compileJava "-Pforge_version=66.0.0"
# Keep the Forge Minecraft target separate from common/Fabric overrides.
forge_minecraft_version=26.3
forge_version=66.0.12
forge_version_range=[66.0.0,)
forge_loader_version_range=[66,)

mod_id=cauldrondispenser
mod_name=Cauldron Dispenser
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.cauldrondispenser
